<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0b0f19"/>
  <!-- Gold gradient glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="256" fill="url(#glow)"/>

  <!-- Candlestick chart decoration -->
  <!-- Candle 1 (bullish - red in TW style) -->
  <rect x="100" y="280" width="24" height="80" rx="3" fill="#ef4444"/>
  <line x1="112" y1="260" x2="112" y2="280" stroke="#ef4444" stroke-width="4"/>
  <line x1="112" y1="360" x2="112" y2="375" stroke="#ef4444" stroke-width="4"/>

  <!-- Candle 2 (bearish - green in TW style) -->
  <rect x="156" y="220" width="24" height="100" rx="3" fill="#10b981"/>
  <line x1="168" y1="200" x2="168" y2="220" stroke="#10b981" stroke-width="4"/>
  <line x1="168" y1="320" x2="168" y2="345" stroke="#10b981" stroke-width="4"/>

  <!-- Candle 3 (bullish - big) -->
  <rect x="212" y="180" width="24" height="130" rx="3" fill="#ef4444"/>
  <line x1="224" y1="155" x2="224" y2="180" stroke="#ef4444" stroke-width="4"/>
  <line x1="224" y1="310" x2="224" y2="330" stroke="#ef4444" stroke-width="4"/>

  <!-- Candle 4 (bearish) -->
  <rect x="268" y="210" width="24" height="90" rx="3" fill="#10b981"/>
  <line x1="280" y1="190" x2="280" y2="210" stroke="#10b981" stroke-width="4"/>
  <line x1="280" y1="300" x2="280" y2="320" stroke="#10b981" stroke-width="4"/>

  <!-- Candle 5 (bullish - tall) -->
  <rect x="324" y="140" width="24" height="150" rx="3" fill="#ef4444"/>
  <line x1="336" y1="115" x2="336" y2="140" stroke="#ef4444" stroke-width="4"/>
  <line x1="336" y1="290" x2="336" y2="310" stroke="#ef4444" stroke-width="4"/>

  <!-- Candle 6 (bullish) -->
  <rect x="380" y="115" width="24" height="120" rx="3" fill="#ef4444"/>
  <line x1="392" y1="95" x2="392" y2="115" stroke="#ef4444" stroke-width="4"/>
  <line x1="392" y1="235" x2="392" y2="255" stroke="#ef4444" stroke-width="4"/>

  <!-- Trend line -->
  <line x1="90" y1="370" x2="420" y2="130" stroke="#f59e0b" stroke-width="3" stroke-dasharray="12,6" opacity="0.6"/>

  <!-- Gold star/crown indicator at top right -->
  <circle cx="400" cy="112" r="24" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
  <text x="400" y="120" text-anchor="middle" font-size="22" fill="#f59e0b">📈</text>

  <!-- Bottom bar grid line -->
  <line x1="80" y1="400" x2="432" y2="400" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Volume bars -->
  <rect x="100" y="385" width="24" height="15" rx="2" fill="#ef444460"/>
  <rect x="156" y="380" width="24" height="20" rx="2" fill="#10b98160"/>
  <rect x="212" y="375" width="24" height="25" rx="2" fill="#ef444460"/>
  <rect x="268" y="382" width="24" height="18" rx="2" fill="#10b98160"/>
  <rect x="324" y="372" width="24" height="28" rx="2" fill="#ef444460"/>
  <rect x="380" y="370" width="24" height="30" rx="2" fill="#ef444460"/>
</svg>
